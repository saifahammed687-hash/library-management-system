<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="brand2">
      <svg width="20" height="20" viewBox="0 0 48 48" fill="none" style="vertical-align:-4px;margin-right:6px;" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 10c6-3 12-3 20 1v27c-8-4-14-4-20-1V10z" stroke="#c9a45c" stroke-width="2" stroke-linejoin="round"/>
        <path d="M44 10c-6-3-12-3-20 1v27c8-4 14-4 20-1V10z" stroke="#c9a45c" stroke-width="2" stroke-linejoin="round"/>
      </svg>Library System
    </div>
    <div class="role-badge" id="roleBadge">Role</div>
    <nav id="navItems"></nav>
    <button class="nav-item logout" id="logoutBtn">⏻ Logout</button>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div id="welcomeText" style="color:#6b6a5c;font-size:14px;"></div>
      </div>
      <div class="topbar-right">
        <div class="topbar-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="globalSearchInput" placeholder="Search books...">
        </div>
        <button class="icon-btn" id="notifBtn" title="Return warnings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <span class="badge-dot" id="notifBadge"></span>
        </button>
        <div class="avatar" id="avatarCircle">U</div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
